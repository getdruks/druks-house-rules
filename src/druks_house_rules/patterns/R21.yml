id: R21
language: python
message: four or more names from $MODULE; import the module and qualify
rule:
  kind: import_from_statement
  all:
    - has:
        field: module_name
        pattern: $MODULE
    - has:
        nthChild: 5
    # `from . import a, b, c, d` imports modules, which is what the rule asks for.
    - not:
        has:
          field: module_name
          regex: '^\.+$'
ignores:
  - "**/__init__.py"
