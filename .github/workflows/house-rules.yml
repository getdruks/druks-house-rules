name: House rules

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  house-rules:
    uses: getdruks/druks-workflows/.github/workflows/house-rules.yml@v1
    with:
      ref: ${{ github.event.pull_request.head.sha }}
