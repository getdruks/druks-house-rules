[project]
name = "druks-house-rules"
version = "0.0.4"
description = "The hard rules every Druks repository holds a change to, as one check."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ast-grep-cli>=0.51.0",
    "grimp>=3.17",
    "pyyaml>=6.0",
    "ruff>=0.17",
]

[project.optional-dependencies]
app = ["druks"]

[project.scripts]
druks-house-rules = "druks_house_rules.cli:main"

[project.entry-points."druks.apps"]
house_rules = "druks_house_rules.app:HouseRules"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv.sources]
druks = { git = "https://github.com/czpython/druks", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/druks_house_rules"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
